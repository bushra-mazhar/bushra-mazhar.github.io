<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root{
    --ink:#0E1826;
    --panel:#152238;
    --panel-2:#1B2C46;
    --line:#2A3E5C;
    --line-soft:#20304A;
    --amber:#F2A93B;
    --amber-dim:#C88A2E;
    --cyan:#6FD4C7;
    --text:#E9EEF7;
    --text-dim:#93A2BC;
    --text-faint:#5D6E8C;
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--amber); color:var(--ink); }

  .mono{ font-family:'JetBrains Mono', monospace; }
  .display{ font-family:'Space Grotesk', sans-serif; }

  /* blueprint grid background */
  .grid-bg{
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: -1px -1px;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- NAV ---------- */
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 5vw;
    background:rgba(14,24,38,0.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-soft);
  }
  .nav-mark{ display:flex; align-items:center; gap:10px; }
  .nav-mark .dot{ width:8px; height:8px; background:var(--amber); border-radius:1px; }
  .nav-mark span{ font-size:14px; letter-spacing:0.08em; }
  .nav-links{ display:flex; gap:32px; }
  .nav-links a{
    font-size:13px; letter-spacing:0.06em; color:var(--text-dim);
    text-transform:uppercase; position:relative; padding-bottom:3px;
    transition:color .2s ease;
  }
  .nav-links a:hover{ color:var(--amber); }
  .nav-cta{
    border:1px solid var(--amber-dim); color:var(--amber);
    padding:8px 16px; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    transition:all .2s ease;
  }
  .nav-cta:hover{ background:var(--amber); color:var(--ink); }
  .burger{ display:none; }

  /* ---------- HERO ---------- */
  .hero{
    min-height:100vh;
    display:flex; flex-direction:column; justify-content:center;
    padding: 140px 5vw 80px;
    position:relative;
    border-bottom:1px solid var(--line-soft);
  }
  .hero-tag{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--cyan); margin-bottom:26px;
  }
  .hero-tag .bar{ width:24px; height:1px; background:var(--cyan); }
  .hero h1{
    font-size:clamp(42px, 8vw, 92px);
    line-height:0.98;
    margin:0 0 22px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .hero h1 .accent{ color:var(--amber); }
  .hero-sub{
    max-width:620px;
    font-size:18px; line-height:1.65;
    color:var(--text-dim);
    margin-bottom:40px;
  }
  .cursor{ display:inline-block; width:10px; height:1.1em; background:var(--amber); vertical-align:text-bottom; animation:blink 1.1s steps(1) infinite; margin-left:4px;}
  @keyframes blink{ 50%{ opacity:0; } }

  .hero-actions{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:64px; }
  .btn-primary{
    background:var(--amber); color:var(--ink); font-weight:600;
    padding:14px 28px; font-size:14px; letter-spacing:0.03em;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .2s ease, background .2s ease;
  }
  .btn-primary:hover{ background:#FFC266; transform:translateY(-2px); }
  .btn-ghost{
    border:1px solid var(--line); color:var(--text);
    padding:14px 28px; font-size:14px; letter-spacing:0.03em;
    transition:border-color .2s ease, color .2s ease;
  }
  .btn-ghost:hover{ border-color:var(--amber); color:var(--amber); }

  .hero-meta{
    display:flex; gap:48px; flex-wrap:wrap;
    padding-top:32px; border-top:1px solid var(--line-soft);
  }
  .hero-meta div{ display:flex; flex-direction:column; gap:6px; }
  .hero-meta .k{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); }
  .hero-meta .v{ font-size:14px; color:var(--text); }

  /* corner brackets */
  .bracket{ position:relative; }
  .bracket::before, .bracket::after{
    content:''; position:absolute; width:14px; height:14px;
    border-color:var(--amber-dim); opacity:0.7;
  }
  .bracket::before{ top:-1px; left:-1px; border-top:1px solid; border-left:1px solid; }
  .bracket::after{ bottom:-1px; right:-1px; border-bottom:1px solid; border-right:1px solid; }

  /* ---------- SECTION HEADER ---------- */
  .section{ padding:110px 5vw; border-bottom:1px solid var(--line-soft); }
  .sec-head{ display:flex; align-items:baseline; gap:18px; margin-bottom:56px; }
  .sec-num{ font-size:13px; color:var(--amber); }
  .sec-title{ font-size:clamp(28px,4vw,40px); font-weight:600; }
  .sec-line{ flex:1; height:1px; background:var(--line); }

  /* ---------- ABOUT ---------- */
  .about-grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:60px; }
  .about-text p{ font-size:17px; line-height:1.8; color:var(--text-dim); margin-bottom:20px; }
  .spec-sheet{ border:1px solid var(--line); padding:28px; background:var(--panel); }
  .spec-row{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line-soft); font-size:14px; }
  .spec-row:last-child{ border-bottom:none; }
  .spec-row .k{ color:var(--text-faint); }
  .spec-row .v{ color:var(--text); text-align:right; }

  /* ---------- SKILLS ---------- */
  .skill-cat{ margin-bottom:36px; }
  .skill-cat-label{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--cyan); margin-bottom:16px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{
    border:1px solid var(--line); padding:9px 16px; font-size:13px;
    color:var(--text); background:var(--panel);
    transition:border-color .2s ease, transform .15s ease;
  }
  .chip:hover{ border-color:var(--amber); transform:translateY(-2px); }

  /* ---------- PROJECTS ---------- */
  .proj-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:28px; }
  .proj-card{
    border:1px solid var(--line); background:var(--panel);
    padding:32px; display:flex; flex-direction:column; gap:16px;
    transition:border-color .25s ease, transform .25s ease;
  }
  .proj-card:hover{ border-color:var(--amber-dim); transform:translateY(-4px); }
  .proj-index{ font-size:12px; color:var(--text-faint); }
  .proj-title{ font-size:21px; font-weight:600; }
  .proj-desc{ font-size:14.5px; line-height:1.7; color:var(--text-dim); flex:1; }
  .proj-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .proj-tag{ font-size:11px; color:var(--amber); border:1px solid var(--amber-dim); padding:4px 10px; letter-spacing:0.03em; }
  .proj-link{ font-size:13px; color:var(--cyan); display:inline-flex; align-items:center; gap:6px; margin-top:6px; }
  .proj-link:hover{ color:#9be8dd; }

  /* ---------- EXPERIENCE / EDUCATION ---------- */
  .timeline{ display:flex; flex-direction:column; gap:0; }
  .t-item{ display:grid; grid-template-columns:140px 24px 1fr; gap:0; padding-bottom:44px; position:relative; }
  .t-item:last-child{ padding-bottom:0; }
  .t-date{ font-size:13px; color:var(--text-faint); padding-top:2px; }
  .t-rail{ display:flex; flex-direction:column; align-items:center; }
  .t-dot{ width:9px; height:9px; background:var(--amber); margin-top:4px; }
  .t-bar{ flex:1; width:1px; background:var(--line); margin-top:6px; }
  .t-content{ padding-left:24px; }
  .t-title{ font-size:18px; font-weight:600; margin-bottom:4px; }
  .t-org{ font-size:14px; color:var(--cyan); margin-bottom:10px; }
  .t-desc{ font-size:14px; color:var(--text-dim); line-height:1.7; }

  /* ---------- CONTACT ---------- */
  .contact{ padding:110px 5vw 60px; text-align:center; }
  .contact h2{ font-size:clamp(32px,6vw,60px); font-weight:700; margin-bottom:20px; }
  .contact p{ color:var(--text-dim); font-size:16px; margin-bottom:44px; }
  .contact-links{ display:flex; gap:20px; justify-content:center; flex-wrap:wrap; margin-bottom:80px; }
  .contact-link{
    border:1px solid var(--line); padding:16px 28px; font-size:14px;
    display:flex; align-items:center; gap:10px;
    transition:border-color .2s ease, transform .2s ease;
  }
  .contact-link:hover{ border-color:var(--amber); transform:translateY(-2px); color:var(--amber); }
  .foot{ font-size:12px; color:var(--text-faint); text-align:center; padding-bottom:32px; }

  @media (max-width: 860px){
    .nav-links{ display:none; }
    .about-grid{ grid-template-columns:1fr; }
    .t-item{ grid-template-columns:90px 18px 1fr; }
  }
</style>
</head>

const { useEffect, useState } = React;

function useScrollSpy(ids){
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: "-40% 0px -55% 0px" });
    ids.forEach(id => { const el = document.getElementById(id); if(el) obs.observe(el); });
    return () => obs.disconnect();
  }, [ids]);
  return active;
}
